name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run type checking
        run: npm run typecheck

  test-engine:
    name: Test Engine
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run engine tests
        run: npx vitest run --project engine

  test-backend:
    name: Test Backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build shared engine
        run: npm run build:engine

      - name: Run backend tests
        run: npx vitest run --project backend-unit --project backend-api

  test-frontend:
    name: Test Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build shared engine
        run: npm run build:engine

      - name: Run frontend tests
        run: npx vitest run --project frontend-unit

  test-latex:
    name: Test LaTeX Export
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # TeX Live is the heaviest thing in this workflow, so its .debs are
      # cached and only downloaded when the package list below changes — the
      # key hashes this file, so editing the list invalidates it on its own.
      # A miss costs what it always did; a hit skips the download and only
      # unpacks.
      - name: Cache the LaTeX packages
        uses: actions/cache@v4
        # The cache is an optimisation, not a correctness requirement: if it is
        # unavailable for any reason the install below simply downloads as it
        # always did. Non-fatal on purpose, because this job gates `build` and a
        # caching hiccup must never be the thing that blocks a deploy.
        continue-on-error: true
        with:
          path: ~/apt-archives
          key: apt-texlive-${{ runner.os }}-${{ hashFiles('.github/workflows/ci.yml') }}

      # The export is only as good as the document it produces, and every
      # defect it has had was invisible until something compiled it: a raw
      # Greek letter aborted the build, boxes printed over their neighbours,
      # nodes drifted off the layout the user drew. So CI compiles it.
      #
      # base = pdflatex, extra = the standalone class and booktabs, pictures
      # = pgf/tikz including the logic-gate shapes the fault-tree export
      # draws with.
      - name: Install a LaTeX toolchain
        run: |
          mkdir -p ~/apt-archives/partial
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            -o Dir::Cache::archives="$HOME/apt-archives" \
            texlive-latex-base \
            texlive-latex-extra \
            texlive-pictures \
            texlive-fonts-recommended
          # apt runs as root and takes the directory with it; hand it back so
          # the cache step can read what it just downloaded.
          sudo chown -R "$USER" ~/apt-archives

      - name: Install dependencies
        run: npm ci

      - name: Build shared engine
        run: npm run build:engine

      - name: Compile the exported diagrams
        run: npm run test:latex

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test-engine, test-backend, test-frontend, test-latex]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build all packages
        run: npm run build
