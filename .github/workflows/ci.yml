name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run type checking
        run: npm run typecheck

  test-engine:
    name: Test Engine
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run engine tests
        run: npx vitest run --project engine

  test-backend:
    name: Test Backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build shared engine
        run: npm run build:engine

      - name: Run backend tests
        run: npx vitest run --project backend-unit --project backend-api --project backend-integration

  test-frontend:
    name: Test Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build shared engine
        run: npm run build:engine

      - name: Run frontend tests
        run: npx vitest run --project frontend-unit

  test-latex:
    name: Test LaTeX Export
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # TeX Live is the heaviest thing in this workflow, so its .debs are
      # cached and only downloaded when the package list below changes — the
      # key hashes this file, so editing the list invalidates it on its own.
      # A miss costs what it always did; a hit skips the download and only
      # unpacks.
      - name: Cache the LaTeX packages
        uses: actions/cache@v4
        # The cache is an optimisation, not a correctness requirement: if it is
        # unavailable for any reason the install below simply downloads as it
        # always did. Non-fatal on purpose, because this job gates `build` and a
        # caching hiccup must never be the thing that blocks a deploy.
        continue-on-error: true
        with:
          path: ~/apt-archives
          key: apt-texlive-${{ runner.os }}-${{ hashFiles('.github/workflows/ci.yml') }}

      # The export is only as good as the document it produces, and every
      # defect it has had was invisible until something compiled it: a raw
      # Greek letter aborted the build, boxes printed over their neighbours,
      # nodes drifted off the layout the user drew. So CI compiles it.
      #
      # base = pdflatex, extra = the standalone class and booktabs, pictures
      # = pgf/tikz including the logic-gate shapes the fault-tree export
      # draws with.
      - name: Install a LaTeX toolchain
        run: |
          mkdir -p ~/apt-archives/partial
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            -o Dir::Cache::archives="$HOME/apt-archives" \
            texlive-latex-base \
            texlive-latex-extra \
            texlive-pictures \
            texlive-fonts-recommended
          # apt runs as root and takes the directory with it; hand it back so
          # the cache step can read what it just downloaded.
          sudo chown -R "$USER" ~/apt-archives

      - name: Install dependencies
        run: npm ci

      - name: Build shared engine
        run: npm run build:engine

      - name: Compile the exported diagrams
        run: npm run test:latex

  test-e2e:
    name: Test E2E
    runs-on: ubuntu-latest

    # The suite drives the real stack, so it needs the real database. Redis
    # is deliberately absent: the rate limiter fails open without it, and
    # doing so costs nothing now that a disconnected client no longer queues
    # commands (see the enableOfflineQueue note in backend/src/index.ts).
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ramsey
          POSTGRES_PASSWORD: ramsey
          POSTGRES_DB: ramsey
        ports:
          - 5432:5432
        # Without this the job races the database: the steps below start as
        # soon as the container does, not as soon as it can answer.
        options: >-
          --health-cmd "pg_isready -U ramsey"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://ramsey:ramsey@localhost:5432/ramsey?schema=public
      # A throwaway value for a throwaway database. The schema requires 32
      # characters; nothing here is or resembles a real secret.
      JWT_SECRET: ci-only-jwt-secret-not-a-real-key-0123456789

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build shared engine
        run: npm run build:engine

      # Every db and dev script passes --env-file, which Node refuses to
      # start without. An empty file satisfies it and keeps configuration in
      # the job env above, where it is visible, rather than in a file that
      # looks like it holds secrets.
      - name: Create the empty env file the scripts expect
        run: touch .env

      # The repo's own script: prisma is a dependency of packages/backend and is
      # not hoisted to the root, so `npx prisma` from here does not resolve it.
      - name: Apply database migrations
        run: npm run db:migrate:deploy -w packages/backend

      # Chromium only: the suite pins one project, and the browser download
      # is the slowest step here.
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: npm run test:e2e

      # The report names which spec failed and at which step; the traces are
      # what make a CI-only failure diagnosable without reproducing it.
      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test-engine, test-backend, test-frontend, test-latex, test-e2e]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build all packages
        run: npm run build
